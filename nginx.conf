# =====================================================================
# Nginx Configuration for Venkat Sai Travels
# Works on main domain (venkatsaitravels.com, www) or any subdomain
# =====================================================================

# 1. HTTP to HTTPS redirect for all domains
server {
    listen 80;
    listen [::]:80;
    server_name venkatsaitravels.com www.venkatsaitravels.com venkatsai.roiclients.co.in;

    # Certbot challenge directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name venkatsaitravels.com www.venkatsaitravels.com venkatsai.roiclients.co.in;

    # SSL Certificates (update paths to match your Certbot domain)
    ssl_certificate /etc/letsencrypt/live/venkatsai.roiclients.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venkatsai.roiclients.co.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 15M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static assets with long-term caching
    location /assets/ {
        alias /var/www/venkatsai/dist/client/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @node;
    }

    # Public static files (favicon, robots.txt, etc.)
    location ~* \.(ico|png|jpg|jpeg|webp|svg|woff2?|ttf|eot)$ {
        root /var/www/venkatsai/dist/client;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri @node;
    }

    # All SSR & API requests proxy to Node / srvx server on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location @node {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
